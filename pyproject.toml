# Tool settings only. The project is installed with SCRIPTS/INSTALL.sh, not with pip.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "SIM", "RUF"]
# S101 assert, S603/S607 subprocess with fixed argument lists, S108 /tmp in tests
ignore = ["S101", "S603", "S607", "S108"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
