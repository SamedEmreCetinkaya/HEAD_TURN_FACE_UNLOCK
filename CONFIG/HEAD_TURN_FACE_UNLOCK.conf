# Head-turn face unlock settings. Installed to /etc/head-turn-face-unlock/HEAD_TURN_FACE_UNLOCK.conf.
# An unknown key or a value out of range turns face unlock off (logins use the password)
# until it is fixed; `sudo head-turn-face-unlock status` shows what is wrong.

# Language of the messages: en or tr.
LANGUAGE=en

# auto finds the color and infrared pair; or name the device, for example /dev/video0.
COLOR_CAMERA=auto
INFRARED_CAMERA=auto

# Seconds one verification may take before the password is asked for (2-30).
ATTEMPT_SECONDS=5

# Seconds the service keeps its models loaded after the last request (0-86400).
IDLE_EXIT_SECONDS=600

# Cosine similarity of face embeddings (0.3-0.99). Higher is stricter. Measured on the
# author's machine: the enrolled person 0.69-0.91 in color and 0.80-0.94 in infrared,
# other people 0.21-0.25. Every angle bin the turn crosses is checked.
MATCH_THRESHOLD=0.60
COLOR_MEDIAN_THRESHOLD=0.65
MATCH_FLOOR=0.45
INFRARED_THRESHOLD=0.80

# Seconds enrollment may take (30-600).
ENROLL_SECONDS=120
